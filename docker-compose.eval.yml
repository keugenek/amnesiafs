version: "3.9"

# Docker Compose configuration for RAGAS evaluation
# Run with: docker compose -f docker-compose.eval.yml up
#
# NOTE: This configuration uses the HOST machine's Ollama instance.
# Ensure Ollama is running on the host before starting evaluation.

services:
  # CognitiveFS evaluation container
  # Uses host's Ollama via host.docker.internal
  cognitivefs-eval:
    build:
      context: .
      dockerfile: Dockerfile.eval
    image: cognitivefs:eval
    platform: linux/amd64
    container_name: cognitivefs-eval
    privileged: true
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - .:/workspace
      - ./eval-results:/workspace/eval-results
      - ./test-data:/workspace/test-data
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/src
      # Use host's Ollama (host.docker.internal works in Docker Desktop/WSL2)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Use a capable model (14B+ recommended for reliable RAGAS scores)
      - RAGAS_MODEL=qwen2.5:14b-instruct-q4_K_M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  # Fast unit tests (no Docker, no FUSE)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          cd $GITHUB_WORKSPACE
          PYTHONPATH=src python -m pytest tests/ -v --ignore=tests/test_fuse_ops.py

  # E2E acceptance tests - disabled due to disk space constraints on GitHub runners
  # To run locally: docker compose -f docker-compose.eval.yml run cognitivefs-eval bash scripts/e2e-acceptance.sh
  # e2e-acceptance:
  #   runs-on: ubuntu-latest
  #   needs: unit-tests
  #   steps: ...

  # Lint and type checking (optional but recommended)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/ --ignore=E501,F401
        continue-on-error: true  # Don't fail CI on lint errors for now

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source archive
        run: git archive --format=tar.gz --output=cognitivefs-${{ github.ref_name }}.tar.gz HEAD

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: cognitivefs-${{ github.ref_name }}.tar.gz
